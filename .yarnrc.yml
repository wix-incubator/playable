compressionLevel: mixed

enableGlobalCache: true

enableTelemetry: 0

enableScripts: false

logFilters:
  - code: YN0002
    level: discard
  - code: YN0060
    level: discard
  - code: YN0005
    level: discard
  - code: YN0007
    level: discard
  - code: YN0008
    level: discard
  - code: YN0013
    level: discard

nmMode: hardlinks-local

nodeLinker: node-modules

npmRegistryServer: "https://npm.dev.wixpress.com/"

unsafeHttpWhitelist:
  - npm.dev.wixpress.com

yarnPath: .yarn/releases/yarn-4.12.0.cjs
